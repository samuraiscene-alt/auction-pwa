name: Court usage codes audit (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/court-usage-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect official usage selector JavaScript without extracting user data
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            'https://www.courtauction.go.kr/pgj/cm/js/pgj.js',
            'https://www.courtauction.go.kr/pgj/ui/pgj100/PGJ151F00.xml'
          ];
          for(const url of urls){
            const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
            try{
              const r=await fetch(url,{signal:controller.signal,headers:{Accept:'text/plain, text/xml, application/javascript, */*'}});
              const data=await r.text();
              const text=data.slice(0,500000);
              console.log('Source:',new URL(url).pathname,'HTTP:',r.status,'bytes:',data.length,'type:',r.headers.get('content-type'));
              for(const needle of ['selectMclLst','selectSclLst','dsignUsgDvsCd','lclDspslGdsLstUsgCd']){
                const ix=text.indexOf(needle);
                const snippet=ix<0?'not found':text.slice(Math.max(0,ix-300),Math.min(text.length,ix+350))
                  .replace(/[^\x20-\x7E가-힣]/g,' ').slice(0,650);
                console.log('  Search:',needle,'match:',snippet);
              }
            }catch(e){console.log('Source unavailable:',new URL(url).pathname,e.name,e.message)}
            finally{clearTimeout(timer)}
          }
          NODE

      - name: Probe court medium and small classification endpoints
        run: |
          node --input-type=module <<'NODE'
          const probes=[
            {level:'medium',name:'selectMclLst',key:'code',parent:'20000',arrays:['mclLst','usgMclLst']},
            {level:'small',name:'selectSclLst',key:'code',parent:'21200',arrays:['sclLst','usgSclLst']}
          ];
          for(const p of probes){
            const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
            try{
              const response=await fetch('https://www.courtauction.go.kr/pgj/pgj002/'+p.name+'.on',{
                method:'POST',
                headers:{'Accept':'application/json','Content-Type':'application/json; charset=UTF-8',
                  'Referer':'https://www.courtauction.go.kr/pgj/index.on'},
                body:JSON.stringify({[p.key]:p.parent}),signal:controller.signal
              });
              console.log('Level:',p.level,'Parent:',p.parent,'HTTP:',response.status);
              if(!response.ok)throw Error('HTTP '+response.status);
              const result=await response.json();
              console.log('API status:',result.status);
              console.log('API message:',String(result.message||'').slice(0,160));
              console.log('IP check:',result.data?.ipcheck);
              console.log('Data shape:',Object.fromEntries(Object.entries(result.data||{}).slice(0,12).map(([k,v])=>[k,Array.isArray(v)?'array:'+v.length:typeof v])));
              console.log('Data keys:',Object.keys(result.data||{}).slice(0,15).join(', '));
              const key=p.arrays.find(k=>Array.isArray(result.data?.[k]));
              const items=key?result.data[key]:[];
              console.log('Array key:',key||'(unrecognized)','Count:',items.length);
              if(items.length){
                console.log('First entry field names:',Object.keys(items[0]).slice(0,20).join(', '));
                // Classification names and codes are public. Print only known field names, no raw server payload.
                console.log('Recognized rows:',JSON.stringify(items.slice(0,100).map(x=>({
                  code:String(x.code??x.usgCd??'').slice(0,20),
                  name:String(x.name??x.usgNm??'').slice(0,80)
                }))));
              }
              if(items.length===0&&String(result.status)==='200'){
                // Hypothesis: child lists additionally require the same dsignUsgDvsCd
                // field used by the official large-list request. One bounded call per level.
                const retryController=new AbortController(),retryTimer=setTimeout(()=>retryController.abort(),12000);
                try{
                  const retryResponse=await fetch('https://www.courtauction.go.kr/pgj/pgj002/'+p.name+'.on',{
                    method:'POST',
                    headers:{'Accept':'application/json','Content-Type':'application/json; charset=UTF-8',
                      'Referer':'https://www.courtauction.go.kr/pgj/index.on'},
                    body:JSON.stringify({[p.key]:p.parent,dsignUsgDvsCd:''}),signal:retryController.signal
                  });
                  console.log('Additional-field hypothesis HTTP:',retryResponse.status);
                  if(retryResponse.ok){
                    const retry=await retryResponse.json();
                    const arrayName=p.arrays.find(k=>Array.isArray(retry.data?.[k]));
                    console.log('Additional-field hypothesis response:',JSON.stringify({
                      status:retry.status,message:String(retry.message||'').slice(0,100),
                      arrayName:arrayName||null,count:arrayName?retry.data[arrayName].length:null}));
                    if(arrayName&&retry.data[arrayName].length>0){
                      console.log('Additional-field hypothesis first row:',JSON.stringify(retry.data[arrayName][0]).slice(0,500));
                    }
                  }
                }catch(error){console.log('Additional-field hypothesis error:',error.name,error.message)}
                finally{clearTimeout(retryTimer)}
              }
              if(!key||items.length===0||String(result.status)!=='200'){console.error('AUDIT FAILED: classification response is empty or unexpected');process.exitCode=1;}
            }catch(error){console.error('Probe failed',p.level,error.name,error.cause?.code||error.message);process.exitCode=1}
            finally{clearTimeout(timer)}
          }
          NODE

      - name: Query official large classification list once
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://www.courtauction.go.kr/pgj/pgj002/selectLclLst.on';
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),15000);
          const expected=[['10000','토지'],['20000','건물'],['30000','차량및운송장비'],['40000','기타']];
          try {
            const response=await fetch(endpoint,{method:'POST',headers:{
              'Accept':'application/json','Content-Type':'application/json; charset=UTF-8',
              'Referer':'https://www.courtauction.go.kr/pgj/index.on'
            },body:JSON.stringify({dsignUsgDvsCd:''}),signal:controller.signal});
            console.log('HTTP:',response.status);
            if(!response.ok)throw new Error('HTTP '+response.status);
            const json=await response.json();
            if(String(json.status)!=='200')throw new Error('Non-success court response status');
            const list=json?.data?.usgLclLst;
            if(!Array.isArray(list))throw new Error('Classification list missing');
            const found=list.filter(x=>x&&/^\d{5}$/.test(String(x.code))&&
              typeof x.name==='string'&&x.name.length<=80).map(x=>[String(x.code),x.name]);
            console.log('Court large classes:',JSON.stringify(found));
            console.log('Large count:',found.length);
            console.log('All known codes match:',expected.every(([code,name])=>found.some(x=>x[0]===code&&x[1]===name)));
            console.log('Unrecognized large classes:',JSON.stringify(found.filter(x=>!expected.some(y=>y[0]===x[0]&&y[1]===x[1]))));
            if(!expected.every(([code,name])=>found.some(x=>x[0]===code&&x[1]===name)))process.exitCode=1;
          } catch(error) {
            console.error('Audit failed:',error?.name,error?.cause?.code||error?.message||'unknown');
            process.exitCode=1;
          } finally {clearTimeout(timer);}
          NODE
