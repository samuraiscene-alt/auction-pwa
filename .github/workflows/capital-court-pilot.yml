name: Capital court eight-page collection pilot
on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *' # 03:15 Asia/Seoul, next calendar day
  push:
    branches: [main]
    paths:
      - scripts/capital-court-pilot.cjs
      - scripts/validate-capital-snapshot.cjs
      - scripts/merge-capital-components.cjs
      - .github/workflows/capital-court-pilot.yml
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test court snapshot safety rules
        run: node tests/capital-snapshot-safety.cjs
      - id: collection
        name: Collect and safety-check limited pages
        continue-on-error: true
        run: |
          set +e
          node scripts/capital-court-pilot.cjs 2>&1 | tee /tmp/auction-court-collection.log
          exit ${PIPESTATUS[0]}
      - name: Record last attempt without publishing rejected listings
        env:
          COLLECT_OUTCOME: ${{ steps.collection.outcome }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const ok=process.env.COLLECT_OUTCOME==='success';
          const raw=fs.existsSync('/tmp/auction-court-collection.log')?fs.readFileSync('/tmp/auction-court-collection.log','utf8'):'';
          const reason=ok?'validated':
            /UND_ERR_CONNECT_TIMEOUT|ETIMEDOUT|AbortError|EHOSTUNREACH/.test(raw)?'connection_timeout':
            /Too many conflicting IDs|Conflicting duplicate/.test(raw)?'conflicting_records':
            /Safety validation FAILED|invalid records|validation/.test(raw)?'validation_rejected':
            'collection_failed';
          fs.mkdirSync('data',{recursive:true});
          fs.writeFileSync('data/capital-court-status.json',JSON.stringify({
            schemaVersion:1,attemptedAt:new Date().toISOString(),
            outcome:ok?'success':'failed',scope:'서울·경기·인천',reason,
            detail:ok?'수집·기본 안전검사 통과':
              reason==='connection_timeout'?'법원 서버 연결 시간 초과 · 이전 목록 유지':
              reason==='conflicting_records'?'물건번호 데이터 충돌 · 이전 목록 유지':
              '법원 데이터 검증 미통과 · 이전 목록 유지'
          },null,2)+'\n');
          console.log('Last attempt status:',ok?'success':'failed');
          NODE
      - name: Publish attempt status and ONLY validated snapshot
        env:
          COLLECT_OUTCOME: ${{ steps.collection.outcome }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/capital-court-status.json /tmp/court-attempt-status.json
          if [ "$COLLECT_OUTCOME" = "success" ]; then
            cp data/capital-court-pilot.json /tmp/court-validated-snapshot.json
          fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if node - <<'NODE'
          const fs=require('fs');
          try {
            const remote=JSON.parse(fs.readFileSync('data/capital-court-status.json','utf8'));
            const local=JSON.parse(fs.readFileSync('/tmp/court-attempt-status.json','utf8'));
            if(Date.parse(remote.attemptedAt)>Date.parse(local.attemptedAt)){
              console.log('Newer attempt already published; skipping stale attempt.');
              process.exit(3);
            }
          } catch(error) {if(error.code!=='ENOENT')throw error;}
          NODE
            then
              :
            else
              code=$?
              if [ "$code" -eq 3 ]; then exit 0; fi
              exit "$code"
            fi
            cp /tmp/court-attempt-status.json data/capital-court-status.json
            git add data/capital-court-status.json
            if [ "$COLLECT_OUTCOME" = "success" ]; then
              if node - <<'NODE'
          const fs=require('fs');
          try {
            const remote=JSON.parse(fs.readFileSync('data/capital-court-pilot.json','utf8'));
            const candidate=JSON.parse(fs.readFileSync('/tmp/court-validated-snapshot.json','utf8'));
            if(Date.parse(remote.fetchedAt)>Date.parse(candidate.fetchedAt)){
              console.log('Newer validated data already published; keep it.');
              process.exit(3);
            }
          } catch(error) {if(error.code!=='ENOENT')throw error;}
          NODE
              then
                cp /tmp/court-validated-snapshot.json data/capital-court-pilot.json
                git add data/capital-court-pilot.json
              else
                code=$?
                if [ "$code" -ne 3 ]; then exit "$code"; fi
              fi
            fi
            if git diff --cached --quiet; then
              echo "No change to publish"
              exit 0
            fi
            git commit -m "data: publish validated metropolitan listing and status"
            if git push origin HEAD:main; then
              echo "Published validated data onto latest branch"
              exit 0
            fi
            echo "Concurrent commit: retrying safe data-only publication ($attempt/4)"
            sleep 2
          done
          echo "::error::Could not publish verified collection safely"
          exit 1
      - name: Deploy current saved snapshot with status
        if: always() && steps.collection.outcome != ''
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
      - name: Mark collection as failed after safely publishing status
        if: steps.collection.outcome == 'failure'
        run: |
          echo "::error::Court search could not be validated. Previous listing snapshot retained."
          exit 1
