name: Capital court property probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capital-court-probe.cjs
      - .github/workflows/capital-court-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query one first page for Seoul, Gyeonggi, Incheon
        run: node scripts/capital-court-probe.cjs
      - name: Upload validated sample report for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: capital-court-probe
          path: data/capital-court-probe.json
          retention-days: 7
