name: Court API connectivity probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/court-api-probe.yml']
  workflow_dispatch:
    inputs:
      court_code:
        description: 'Court office code (e.g. B000210)'
        required: true
        default: 'B000210'
        type: string
      case_number:
        description: 'Public auction case number (e.g. 2024타경100001)'
        required: true
        default: '2023타경4869'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe one court case (read-only, no retry)
        env:
          COURT_CODE: ${{ inputs.court_code || 'B000210' }}
          CASE_NUMBER: ${{ inputs.case_number || '2023타경4869' }}
        run: |
          node --input-type=module <<'NODE'
          const court = (process.env.COURT_CODE || '').trim();
          const caseNo = (process.env.CASE_NUMBER || '').replace(/\s+/g, '');
          if (!/^[A-Za-z][A-Za-z0-9]{3,12}$/.test(court)) {
            console.error('Invalid court code.'); process.exit(1);
          }
          if (!/^\d{4}타경\d{1,12}$/.test(caseNo)) {
            console.error('Invalid case number. Use YYYY타경NNNN.'); process.exit(1);
          }
          const url = 'https://www.courtauction.go.kr/pgj/pgj15A/selectAuctnCsSrchRslt.on';
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 20000);
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json; charset=UTF-8',
                'Accept': 'application/json',
                'Referer': 'https://www.courtauction.go.kr/pgj/index.on'
              },
              body: JSON.stringify({dma_srchCsDtlInf:{cortOfcCd:court,csNo:caseNo}}),
              signal: controller.signal
            });
            console.log('HTTP status:', response.status);
            const raw = await response.text();
            let data;
            try { data = JSON.parse(raw); }
            catch { console.log('Non-JSON response; first characters:', raw.slice(0,80).replace(/[^\x20-\x7E]/g,'?')); process.exitCode=1; }
            if (data) {
              const root = data.data || data;
              const blocked = root.ipcheck === false || data.ipcheck === false || /비정상적인 접속|차단/.test(JSON.stringify(data).slice(0,3000));
              console.log('JSON top-level keys:', Object.keys(data).slice(0,15).join(', '));
              console.log('Explicit IP block:', blocked);
              console.log('Non-empty response:', raw.length > 100);
              if (blocked || !response.ok) process.exitCode=1;
              // No payload printout: avoids accidentally exposing case-party details in public Actions logs.
            }
          } catch (error) {
            console.error('Request failed:', error.name, error.message);
            process.exitCode=1;
          } finally { clearTimeout(timeout); }
          NODE
