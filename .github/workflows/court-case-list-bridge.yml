name: Court listing-to-detail bridge diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe-court-case-list-bridge.cjs
      - scripts/validate-court-case-bridge.cjs
      - scripts/extract-court-status-evidence.cjs
      - tests/court-status-evidence.cjs
      - tests/court-case-bridge.cjs
      - .github/workflows/court-case-list-bridge.yml
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: court-case-list-bridge-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: offline
        name: Validate strict case bridge
        run: |
          node tests/court-case-bridge.cjs
          node tests/court-status-evidence.cjs
      - id: query
        name: Single court list lookup
        continue-on-error: true
        shell: bash
        run: |
          node scripts/probe-court-case-list-bridge.cjs 'court-B000210|2008타경25092|1' > /tmp/case-list-bridge.json 2>/tmp/case-list-error.txt
      - name: Store non-sensitive summary only
        if: always()
        env:
          OFFLINE: ${{ steps.offline.outcome }}
          QUERY: ${{ steps.query.outcome }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          let result=null;
          try { result=JSON.parse(fs.readFileSync('/tmp/case-list-bridge.json','utf8')); } catch {}
          const error=fs.existsSync('/tmp/case-list-error.txt')?fs.readFileSync('/tmp/case-list-error.txt','utf8'):'';
          const reason=process.env.OFFLINE!=='success'?'offline_test_failed':process.env.QUERY==='skipped'?'query_skipped':/BRIDGE_REASON=([a-z_]+)/.exec(error)?.[1]||'unclassified_query_failure';
          const stage=/BRIDGE_STAGE=(list|detail)/.exec(error)?.[1]||'unknown';
          const valid=process.env.OFFLINE==='success'&&process.env.QUERY==='success'&&
            result?.schemaVersion===1&&Number.isInteger(result.exactDisplayLotRows);
          const evidence=result?.statusEvidence;
          const safeCode=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,24}$/.test(v)?v:null;
          const accepted=valid&&result?.detailCaseCrossChecked===true&&
            evidence?.identityVerified===true&&evidence?.legalStatusVerified===false;
          const safeEvidence=accepted?{
            identityVerified:true,
            statusEvidenceAvailable:evidence.statusEvidenceAvailable===true,
            caseProgressCode:safeCode(evidence.caseProgressCode),
            caseSuspensionCode:safeCode(evidence.caseSuspensionCode),
            lotStatusCode:safeCode(evidence.lotStatusCode),
            lotProgressFlag:safeCode(evidence.lotProgressFlag),
            listStatusCode:safeCode(evidence.listStatusCode),
            scheduleResultObservations:Array.isArray(evidence.scheduleResultObservations)?
              evidence.scheduleResultObservations.slice(0,20).filter(o=>o&&/^20\d{6}$/.test(String(o.day))&&safeCode(o.resultCode)).map(o=>({
                day:String(o.day),resultCode:safeCode(o.resultCode),kindCode:safeCode(o.kindCode)
              })):[],
            listingDisplayCandidateFieldNames:Array.isArray(evidence.listingDisplayCandidateFieldNames)?
              evidence.listingDisplayCandidateFieldNames.filter(k=>typeof k==='string'&&/^[A-Za-z][A-Za-z0-9_]{0,49}$/.test(k)&&/(?:stat|rslt|result|jin|stprint|lstprint|progress|label|nm$)/i.test(k)).slice(0,30):[],
            listingDisplayEvidence:Array.isArray(evidence.listingDisplayEvidence)?
              evidence.listingDisplayEvidence.filter(v=>v&&['userStPrint','userLstPrint','mulStatNm','maemulStatNm'].includes(v.field)).slice(0,4).map(v=>({
                field:v.field,fieldPresent:v.fieldPresent===true,
                exactDisplayLabel:['진행','매각','유찰','취하','변경','연기','정지','취소','종국','미종국','신건'].includes(v.exactDisplayLabel)?v.exactDisplayLabel:null
              })):[],
            legalStatusVerified:false
          }:{identityVerified:false,statusEvidenceAvailable:false,legalStatusVerified:false};
          const report={
            schemaVersion:1,attemptedAt:new Date().toISOString(),
            outcome:valid?'list_response_observed':'unverified',
            reason:valid?'processed':reason,
            failedStage:valid?'none':stage,
            exactDisplayLotRows:valid?Math.min(result.exactDisplayLotRows,50):0,
            directInternalCaseMapping:valid&&result.directInternalCaseMapping===true,
            csNoFieldPresent:valid&&result.csNoFieldPresent===true,
            docidFieldPresent:valid&&result.docidFieldPresent===true,
            internalCaseFormatObserved:valid&&result.internalCaseFormatObserved==='digits_only'?'digits_only':'unavailable',
            detailCaseCrossChecked:valid&&result.detailCaseCrossChecked===true,
            detailInternalCaseConsistent:valid&&result.detailInternalCaseConsistent===true,
            detailLotRowUnique:valid&&result.detailLotRowUnique===true,
            docidFormat:valid&&['missing','digits_only','other'].includes(result.docidFormat)?result.docidFormat:'unavailable',
            docidExactlyMatches:valid&&result.docidExactlyMatches===true,
            listCsNoExactlyMatches:valid&&result.listCsNoExactlyMatches===true,
            saNoFieldPresent:valid&&result.saNoFieldPresent===true,
            printCsNoFieldPresent:valid&&result.printCsNoFieldPresent===true,
            listSaNoExactlyMatches:valid&&result.listSaNoExactlyMatches===true,
            printCsNoMatchesDisplay:valid&&result.printCsNoMatchesDisplay===true,
            legalStatusVerified:false,
            statusEvidence:safeEvidence,
            rawResponseSaved:false
          };
          fs.writeFileSync('/tmp/case-list-summary.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Publish only redacted bridge status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for retry in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/case-list-summary.json data/court-case-list-bridge-status.json
            git add data/court-case-list-bridge-status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "diagnostic: record redacted court list-case bridge result"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
