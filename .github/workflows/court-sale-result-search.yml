name: Official court sale result search - bounded diagnostic
on:
  workflow_dispatch:
  # Three bounded post-sale diagnostics: 2026-11-12, 14, 16 at 09:30 KST.
  # Exact-year/day gate below prevents annual repetition.
  schedule:
    - cron: '30 0 12,14,16 11 *'
  push:
    branches: [main]
    paths:
      - scripts/probe-court-sale-result-search.cjs
      - scripts/validate-court-sale-result-search.cjs
      - tests/court-sale-result-search.cjs
      - scripts/compare-court-sale-result-detail.cjs
      - scripts/validate-court-sale-preflight.cjs
      - tests/court-sale-preflight.cjs
      - tests/court-sale-result-detail.cjs
      - tests/court-sale-probe-integration.cjs
      - scripts/court-result-window.cjs
      - tests/court-result-window.cjs
      - .github/workflows/court-sale-result-search.yml
permissions:
  contents: write
jobs:
  sale-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: court-sale-result-readonly-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check strict report safeguards
        run: |
          node tests/court-sale-result-search.cjs
          node tests/court-sale-result-detail.cjs
          node tests/court-sale-preflight.cjs
          node tests/court-result-window.cjs
          node tests/court-sale-probe-integration.cjs
      - name: Single official sale-results search
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [[ ! " 2026-11-12 2026-11-14 2026-11-16 " =~ " $(TZ=Asia/Seoul date +%F) " ]]; then
            printf '%s\n' '{"schemaVersion":1,"observed":false,"reason":"outside_bounded_scheduled_dates","legalStatusVerified":false,"rawResponseSaved":false}' > /tmp/court-sale-result.json
            printf '0\n' > /tmp/court-sale-probe-exit.txt
          else
            set +e
            node scripts/probe-court-sale-result-search.cjs > /tmp/court-sale-result.json
            code=$?
            set -e
            printf '%s\n' "$code" > /tmp/court-sale-probe-exit.txt
          fi
      - name: Redact output summary
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          let d={};
          try{d=JSON.parse(fs.readFileSync('/tmp/court-sale-result.json','utf8'));}catch{}
          const exitCode=Number(fs.readFileSync('/tmp/court-sale-probe-exit.txt','utf8').trim());
          const validReport=d.schemaVersion===1&&d.legalStatusVerified===false&&
            d.rawResponseSaved===false&&typeof d.reason==='string';
          const probeExecutionSucceeded=exitCode===0&&validReport;
          fs.writeFileSync('/tmp/court-sale-probe-health.txt',probeExecutionSucceeded?'ok\n':'error\n');
          const exact=d.observed===true&&d.identityMatched===true&&d.exactDisplayLotRows===1;
          const jointlyVerified=exact&&d.detailCrossChecked===true&&d.rawResultCodeMatched===true&&d.scheduleDayMatched===true;
          const safeCode=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,24}$/.test(v)?v:null;
          const codeKeys=['auctnDxdyRsltCd','dspslGdsStatCd','mulStatcd','jinstatCd','mulJinYn'];
          const labelKeys=['auctnDxdyRsltNm','maeGiilRsltNm','dspslRsltNm'];
          const labels=['매각','유찰','취하','변경','연기','정지','취소','진행','불허가'];
          const result={
            schemaVersion:1,attemptedAt:new Date().toISOString(),
            triggerEvent:['schedule','workflow_dispatch','push'].includes(process.env.EVENT_NAME)?process.env.EVENT_NAME:'unknown',
            probeExecutionSucceeded,
            observed:probeExecutionSucceeded&&d.observed===true,
            daysSinceSale:Number.isInteger(d.daysSinceSale)?d.daysSinceSale:null,
            windowPolicy:'conservative_diagnostic_1_to_7_days',
            failedStage:['connect','response','json','evaluate','detail_preflight','sale_search'].includes(d.failedStage)?d.failedStage:'none',
            reason:typeof d.reason==='string'&&/^[a-z_]{1,40}$/.test(d.reason)?d.reason:'unknown',
            schedulePreflightConfirmed:d.schedulePreflightConfirmed===true,
            detailCrossChecked:exact&&d.detailCrossChecked===true,
            rawResultCodeMatched:exact&&d.detailCrossChecked===true&&d.rawResultCodeMatched===true,
            scheduleDayMatched:exact&&d.detailCrossChecked===true&&d.scheduleDayMatched===true,
            detailCrossCheckReason:typeof d.detailCrossCheckReason==='string'&&[
              'raw_code_cross_checked','sale_result_identity_not_matched','unverified_response',
              'invalid_structure','result_identity_not_unique','internal_case_not_linked',
              'inconsistent_detail_lots','detail_lot_not_unique','result_schedule_day_missing',
              'schedule_not_unique','result_code_not_confirmed','result_schedule_not_target_date'
            ].includes(d.detailCrossCheckReason)?d.detailCrossCheckReason:'not_checked',
            identityMatched:exact,exactDisplayLotRows:Number.isInteger(d.exactDisplayLotRows)?Math.min(d.exactDisplayLotRows,50):0,
            rowCount:Number.isInteger(d.rowCount)?Math.min(d.rowCount,50):null,
            responseIdentityFieldNames:d.observed===true&&Array.isArray(d.responseIdentityFieldNames)?d.responseIdentityFieldNames.filter(x=>[
              'boCd','cortOfcCd','srnSaNo','csNo','saNo','maemulSer','mokmulSer','dspslGdsSeq'
            ].includes(x)).slice(0,8):[],
            responseCandidateFieldNames:d.observed===true&&Array.isArray(d.responseCandidateFieldNames)?d.responseCandidateFieldNames.filter(x=>[
              'boCd','cortOfcCd','srnSaNo','csNo','saNo','maemulSer','mokmulSer','dspslGdsSeq',
              'auctnDxdyRsltCd','auctnDxdyRsltNm','dspslGdsStatCd','mulStatcd','jinstatCd','mulJinYn',
              'dxdyYmd','maeGiil','maegyuljGiil','yuchalCnt','maeGiilRsltNm','dspslRsltNm'
            ].includes(x)).slice(0,25):[],
            fieldNames:exact&&Array.isArray(d.fieldNames)?d.fieldNames.filter(x=>[
              'auctnDxdyRsltCd','auctnDxdyRsltNm','dspslGdsStatCd','mulStatcd','jinstatCd','mulJinYn','maemulSer','mokmulSer','dxdyYmd','maeGiil','maegyuljGiil','yuchalCnt','maeGiilRsltNm','dspslRsltNm'
            ].includes(x)).slice(0,14):[],
            rawCodes:jointlyVerified?Object.fromEntries(codeKeys.map(k=>[k,safeCode(d.rawCodes?.[k])])):{},
            exactDisplayLabels:jointlyVerified?Object.fromEntries(labelKeys.map(k=>[k,labels.includes(d.exactDisplayLabels?.[k])?d.exactDisplayLabels[k]:null])):{},
            legalStatusVerified:false,rawResponseSaved:false
          };
          fs.writeFileSync('/tmp/court-sale-result-summary.json',JSON.stringify(result,null,2)+'\n');
          NODE
      - name: Commit redacted diagnostic only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for retry in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/court-sale-result-summary.json data/court-sale-result-status.json
            git add data/court-sale-result-status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "diagnostic: record official sale result search summary"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Report court probe failure after recording evidence
        run: |
          if [ "$(cat /tmp/court-sale-probe-health.txt)" != "ok" ]; then
            echo "::error::Official court probe failed or returned invalid output. See redacted report."
            exit 1
          fi
