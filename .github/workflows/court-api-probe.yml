name: Court API connectivity probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/court-api-probe.yml']
  workflow_dispatch:
    inputs:
      court_code:
        description: 'Court office code (e.g. B000210)'
        required: true
        default: 'B000210'
        type: string
      case_number:
        description: 'Public auction case number (e.g. 2024타경100001)'
        required: true
        default: '2023타경4869'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe one court case (read-only, no retry)
        env:
          COURT_CODE: ${{ inputs.court_code || 'B000210' }}
          CASE_NUMBER: ${{ inputs.case_number || '2023타경4869' }}
        run: |
          node --input-type=module <<'NODE'
          const court = (process.env.COURT_CODE || '').trim();
          const caseNo = (process.env.CASE_NUMBER || '').replace(/\s+/g, '');
          if (!/^[A-Za-z][A-Za-z0-9]{3,12}$/.test(court)) {
            console.error('Invalid court code.'); process.exit(1);
          }
          if (!/^\d{4}타경\d{1,12}$/.test(caseNo)) {
            console.error('Invalid case number. Use YYYY타경NNNN.'); process.exit(1);
          }
          const url = 'https://www.courtauction.go.kr/pgj/pgj15A/selectAuctnCsSrchRslt.on';
          try {
            let response;
            for (let attempt = 1; attempt <= 2; attempt++) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 20000);
              try {
                response = await fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json; charset=UTF-8',
                'Accept': 'application/json',
                'Referer': 'https://www.courtauction.go.kr/pgj/index.on'
              },
              body: JSON.stringify({dma_srchCsDtlInf:{cortOfcCd:court,csNo:caseNo}}),
              signal: controller.signal
                });
                break;
              } catch (error) {
                const cause = error?.cause;
                console.error('Connection attempt:', attempt, 'error:', error?.name, 'cause code:', String(cause?.code || 'unknown'), 'cause type:', String(cause?.name || 'unknown'));
                if (attempt === 2) throw error;
                await new Promise(resolve => setTimeout(resolve, 1500));
              } finally {
                clearTimeout(timeout);
              }
            }
            console.log('HTTP status:', response.status);
            const raw = await response.text();
            let data;
            try { data = JSON.parse(raw); }
            catch { console.log('Non-JSON response; first characters:', raw.slice(0,80).replace(/[^\x20-\x7E]/g,'?')); process.exitCode=1; }
            if (data) {
              const root = data.data || data;
              const blocked = root.ipcheck === false || data.ipcheck === false || /비정상적인 접속|차단/.test(JSON.stringify(data).slice(0,3000));
              console.log('JSON top-level keys:', Object.keys(data).slice(0,15).join(', '));
              console.log('API status:', typeof data.status === 'string' || typeof data.status === 'number' ? String(data.status).slice(0,60) : typeof data.status);
              console.log('API message category:', typeof data.message === 'string' ? (/오류|실패|error|fail|인증|권한|차단/i.test(data.message) ? 'error-like' : data.message.length ? 'present' : 'empty') : typeof data.message);
              console.log('API errors present:', Array.isArray(data.errors) ? data.errors.length > 0 : !!data.errors);
              console.log('Data shape:', Array.isArray(data.data) ? 'array' : data.data === null ? 'null' : typeof data.data);
              console.log('Data field names:', data.data && typeof data.data === 'object' ? Object.keys(data.data).slice(0,25).join(', ') : '(none)');

              const base = data.data?.dma_csBasInf;
              const record = Array.isArray(base) ? base[0] : base;
              const hasBase = !!record && typeof record === 'object' && !Array.isArray(record) && Object.keys(record).length > 0;
              console.log('Case basic info populated:', hasBase);
              console.log('Basic info shape:', Array.isArray(base) ? 'array (' + base.length + ')' : base === null ? 'null' : typeof base);
              console.log('Basic info field names:', hasBase ? Object.keys(record).slice(0,80).join(', ') : '(none)');
              // Check that the returned case corresponds to the requested case, not merely any case.
              const normalizeDigits = v => String(v ?? '').replace(/[^0-9]/g, '');
              const expectedDigits = normalizeDigits(caseNo);
              const returnedDigits = normalizeDigits(record?.csNo);
              const canonical = caseNo.match(/^(20\\d{2})타경(\\d+)$/);
              const human = String(record?.userCsNo || '').replace(/\\s+/g, '').replace(/타경0+(?=\\d)/,'타경');
              const caseMatch = human ? human === caseNo : !!canonical && returnedDigits === canonical[1]+'0130'+canonical[2].padStart(6,'0');
              const courtMatch = String(record?.cortOfcCd ?? '').toUpperCase() === court.toUpperCase();
              console.log('Returned case number matches request:', caseMatch);
              console.log('Returned court code matches request:', courtMatch);
              console.log('Case number format:', returnedDigits.length ? 'digits-' + returnedDigits.length : 'missing');
              const candidateKeys = Object.keys(record || {}).filter(k => /(?:appr|asmt|prc|price|amt|bid|sale|schd|dt|ymd|mnim|lws|eval)/i.test(k));
              console.log('Basic field candidates for price/date:', candidateKeys.join(', ') || '(none)');
              // Structural inventory: property/schedule nested arrays and safe field names only.
              const rootKeys=Object.keys(data.data || {}).filter(k=>k!=='ipcheck');
              for(const key of rootKeys.slice(0,18)){
                const value=data.data[key];
                const list=Array.isArray(value)?value:(value && typeof value==='object'?[value]:[]);
                const first=list.find(v=>v && typeof v==='object');
                console.log('Section:',key,'kind:',Array.isArray(value)?'array':typeof value,'count:',list.length);
                if(!first)continue;
                const keys=Object.keys(first);
                console.log('Section fields:',key,keys.slice(0,100).join(', '));
                console.log('Possible auction keys:',key,keys.filter(k=>/(?:gds|dspsl|mok|mul|maem|mae|gam|game|appr|prc|price|amt|bid|sale|schd|dt|ymd|eval|addr|lotno|ser)/i.test(k)).slice(0,60).join(', ')||'(none)');
              }
              if (!caseMatch || !courtMatch) {
                console.error('Case or court identity mismatch. Do not use this response for autofill.');
                process.exitCode = 1;
              }
              if (!hasBase) {
                console.error('No populated basic case information. API response alone does not prove case lookup.');
                process.exitCode = 1;
              }
              console.log('Likely business error:', !!data.errors && (Array.isArray(data.errors) ? data.errors.length > 0 : true) || /오류|실패|error|fail|인증|권한|차단/i.test(String(data.message || '')));
              console.log('Explicit IP block:', blocked);
              console.log('Non-empty response:', raw.length > 100);
              if (blocked || !response.ok) process.exitCode=1;
              // No payload printout: avoids accidentally exposing case-party details in public Actions logs.
            }
          } catch (error) {
            console.error('Request failed:', error.name, error.message);
            process.exitCode=1;
          }
          NODE
