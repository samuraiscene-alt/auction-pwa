name: Import six approved generated auction app icons
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-generated-auction-icons.yml
permissions:
  contents: write
jobs:
  import-icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Fetch approved generated source images
        shell: bash
        run: |
          mkdir -p /tmp/auction-approved-icons
          curl -fLsS --retry 0 --connect-timeout 10 --max-time 35 'https://at.adobe.com/XBtHwvpFIM8J3Pd7' -o /tmp/auction-approved-icons/court.png
          curl -fLsS --retry 0 --connect-timeout 10 --max-time 35 'https://at.adobe.com/gYZLdsFim96u8SIX' -o /tmp/auction-approved-icons/capital.png
          curl -fLsS --retry 0 --connect-timeout 10 --max-time 35 'https://at.adobe.com/rAVQUXr4GGc4ks5U' -o /tmp/auction-approved-icons/address.png
          curl -fLsS --retry 0 --connect-timeout 10 --max-time 35 'https://at.adobe.com/oXX0X1vPsAinVlB1' -o /tmp/auction-approved-icons/case.png
          curl -fLsS --retry 0 --connect-timeout 10 --max-time 35 'https://at.adobe.com/Q4q7roREfwiVb4lg' -o /tmp/auction-approved-icons/study.png
          curl -fLsS --retry 0 --connect-timeout 10 --max-time 35 'https://at.adobe.com/x6BSZPIHlZy5aMTC' -o /tmp/auction-approved-icons/main.png
      - name: Build and inspect compressed icon assets
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('/tmp/auction-approved-icons')
          out=Path('assets')
          out.mkdir(exist_ok=True)
          names=['court','capital','address','case','study']
          images=[]
          for name in names+['main']:
              source=root/(name+'.png')
              with Image.open(source) as im:
                  if im.format!='PNG' or im.width<512 or im.height<512 or im.width!=im.height:
                      raise ValueError('Unexpected generated icon source: '+name)
                  im.load()
                  images.append(im.convert('RGB').copy())
          w=112
          sprite=Image.new('RGB',(3*w,2*w),'#ffffff')
          for i,im in enumerate(images[:5]):
              sprite.paste(im.resize((w,w),Image.Resampling.LANCZOS),((i%3)*w,(i//3)*w))
          sprite.save(out/'auction-menu-v077.webp',format='WEBP',quality=86,method=6)
          home=images[5].resize((180,180),Image.Resampling.LANCZOS)
          home.save('auction-ios-icon-v077.png',format='PNG',optimize=True)
          with Image.open(out/'auction-menu-v077.webp') as img:
              assert img.size==(336,224)
          with Image.open('auction-ios-icon-v077.png') as img:
              assert img.size==(180,180) and img.format=='PNG'
          print('Generated icons validated, menu sprite plus Apple 180x180 PNG')
          PY
      - name: Commit generated icons only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/auction-menu-v077.webp auction-ios-icon-v077.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: install six approved generated auction icons"
          git push origin HEAD:main
